org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# File-system watching is unavailable in containers and some sandboxes; polling is good enough
# for a project this size and avoids a hard failure when the native watcher cannot start.
org.gradle.vfs.watch=false
android.useAndroidX=true
android.nonTransitiveRClass=true

# ABIs this build produces. Default is the phone set; add x86_64 for an emulator build:
#   ./gradlew assembleDebug -PnetbootAbis=arm64-v8a,armeabi-v7a,x86_64
# One switch drives the gomobile AAR target, the APK splits and the AAR verification.
netbootAbis=arm64-v8a,armeabi-v7a

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
